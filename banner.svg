<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Tomadon</title>
  <desc id="desc">Junior Information Systems Analyst focused on Vision AI and Machine Learning</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#132a4a"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.35"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#58a6ff" opacity="0.12"/>
    </pattern>

    <clipPath id="frame">
      <rect x="840" y="70" width="270" height="190" rx="4"/>
    </clipPath>

    <!-- Name typing reveal (plays once and stays) -->
    <clipPath id="nameClip">
      <rect x="60" y="110" height="80" width="0">
        <animate attributeName="width" begin="0.3s" dur="1.6s" fill="freeze" calcMode="discrete"
          values="0;40;76;112;148;184;220;256;292;328;364;400;436;472;508;560"
          keyTimes="0;0.0667;0.1333;0.2;0.2667;0.3333;0.4;0.4667;0.5333;0.6;0.6667;0.7333;0.8;0.8667;0.9333;1"/>
      </rect>
    </clipPath>

    <!-- Rotating subtitle lines (12 second loop) -->
    <clipPath id="line1Clip">
      <rect x="70" y="190" height="34" width="0">
        <animate attributeName="width" begin="2s" dur="12s" repeatCount="indefinite"
          values="0;428;428;0;0" keyTimes="0;0.125;0.267;0.317;1"/>
      </rect>
    </clipPath>
    <clipPath id="line2Clip">
      <rect x="70" y="190" height="34" width="0">
        <animate attributeName="width" begin="2s" dur="12s" repeatCount="indefinite"
          values="0;0;440;440;0;0" keyTimes="0;0.333;0.458;0.6;0.65;1"/>
      </rect>
    </clipPath>
    <clipPath id="line3Clip">
      <rect x="70" y="190" height="34" width="0">
        <animate attributeName="width" begin="2s" dur="12s" repeatCount="indefinite"
          values="0;0;562;562;0;0" keyTimes="0;0.667;0.792;0.933;0.983;1"/>
      </rect>
    </clipPath>

    <style>
      .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #58a6ff; }
      .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
      .role { font: 500 22px 'Consolas', 'Courier New', monospace; fill: #c9d1d9; }
      .chip { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
      .tag { font: 600 13px 'Consolas', 'Courier New', monospace; fill: #0d1117; }
      .mono { font: 400 13px 'Consolas', 'Courier New', monospace; fill: #8b949e; }

      .fade1 { animation: fadeUp 0.8s ease-out 0.1s both; }
      .fade4 { animation: fadeUp 0.8s ease-out 2s both; }
      .fade5 { animation: fadeIn 1.2s ease-out 0.5s both; }

      .scanline { animation: scanMove 3.2s ease-in-out infinite; }
      .node { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: 0.3s; }
      .n3 { animation-delay: 0.6s; }
      .n4 { animation-delay: 0.9s; }
      .n5 { animation-delay: 1.2s; }
      .cursor { animation: blink 1s step-end infinite; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scanMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(150px); }
        100% { transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="975" cy="165" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <g fill="#58a6ff">
    <circle cx="640" cy="330" r="2"><animate attributeName="cy" values="330;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="330" r="1.5"><animate attributeName="cy" values="330;-10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="330" r="2.5"><animate attributeName="cy" values="330;-10" dur="11s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="330" r="2"><animate attributeName="cy" values="330;-10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="330" r="1.5"><animate attributeName="cy" values="330;-10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="330" r="1.8"><animate attributeName="cy" values="330;-10" dur="12s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="12s" begin="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Left column: identity -->
  <g class="fade1">
    <text x="70" y="96" class="label">IMAGE ANALYTICS  ·  MACHINE LEARNING</text>
  </g>

  <!-- Name typed once -->
  <g clip-path="url(#nameClip)">
    <text x="66" y="168" class="name" textLength="540" lengthAdjust="spacingAndGlyphs">Gustavo Tomadon</text>
  </g>

  <!-- Rotating typed subtitles -->
  <text x="70" y="214" class="role" fill="#58a6ff">&gt;</text>
  <g clip-path="url(#line1Clip)">
    <text x="92" y="214" class="role" textLength="406" lengthAdjust="spacingAndGlyphs">Junior Information Systems Analyst</text>
  </g>
  <g clip-path="url(#line2Clip)">
    <text x="92" y="214" class="role" textLength="418" lengthAdjust="spacingAndGlyphs">Computer Vision and Image Analytics</text>
  </g>
  <g clip-path="url(#line3Clip)">
    <text x="92" y="214" class="role" textLength="540" lengthAdjust="spacingAndGlyphs">Postgraduate in Machine Learning and Big Data</text>
  </g>
  <rect x="94" y="196" width="11" height="22" fill="#58a6ff" class="cursor">
    <animate attributeName="x" begin="2s" dur="12s" repeatCount="indefinite"
      values="94;500;500;94;94;512;512;94;94;634;634;94;94"
      keyTimes="0;0.125;0.267;0.317;0.333;0.458;0.6;0.65;0.667;0.792;0.933;0.983;1"/>
  </rect>

  <!-- Skill chips -->
  <g class="fade4">
    <rect x="70" y="240" width="146" height="34" rx="17" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="143" y="262" class="chip" text-anchor="middle">Computer Vision</text>

    <rect x="228" y="240" width="136" height="34" rx="17" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="296" y="262" class="chip" text-anchor="middle">Deep Learning</text>

    <rect x="376" y="240" width="100" height="34" rx="17" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="426" y="262" class="chip" text-anchor="middle">Big Data</text>

    <rect x="488" y="240" width="90" height="34" rx="17" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="533" y="262" class="chip" text-anchor="middle">Python</text>
  </g>

  <!-- Right column: detection frame with neural network -->
  <g class="fade5">
    <!-- Detection label -->
    <rect x="840" y="44" width="172" height="26" rx="3" fill="#58a6ff"/>
    <text x="852" y="62" class="tag">vision_ai  conf 0.99</text>

    <!-- Frame corners -->
    <g stroke="#58a6ff" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M840 100 V70 H870"/>
      <path d="M1080 70 H1110 V100"/>
      <path d="M840 230 V260 H870"/>
      <path d="M1080 260 H1110 V230"/>
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </g>
    <rect x="840" y="70" width="270" height="190" fill="none" stroke="#58a6ff" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Network edges -->
    <g stroke="#58a6ff" stroke-opacity="0.28" stroke-width="1.2">
      <line x1="885" y1="115" x2="975" y2="100"/>
      <line x1="885" y1="115" x2="975" y2="140"/>
      <line x1="885" y1="115" x2="975" y2="180"/>
      <line x1="885" y1="115" x2="975" y2="220"/>
      <line x1="885" y1="165" x2="975" y2="100"/>
      <line x1="885" y1="165" x2="975" y2="140"/>
      <line x1="885" y1="165" x2="975" y2="180"/>
      <line x1="885" y1="165" x2="975" y2="220"/>
      <line x1="885" y1="215" x2="975" y2="100"/>
      <line x1="885" y1="215" x2="975" y2="140"/>
      <line x1="885" y1="215" x2="975" y2="180"/>
      <line x1="885" y1="215" x2="975" y2="220"/>
      <line x1="975" y1="100" x2="1065" y2="140"/>
      <line x1="975" y1="100" x2="1065" y2="190"/>
      <line x1="975" y1="140" x2="1065" y2="140"/>
      <line x1="975" y1="140" x2="1065" y2="190"/>
      <line x1="975" y1="180" x2="1065" y2="140"/>
      <line x1="975" y1="180" x2="1065" y2="190"/>
      <line x1="975" y1="220" x2="1065" y2="140"/>
      <line x1="975" y1="220" x2="1065" y2="190"/>
    </g>

    <!-- Signal pulses travelling through the network -->
    <g fill="#f0f6fc">
      <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M885 115 L975 140 L1065 190"/></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M885 215 L975 180 L1065 140"/></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M885 165 L975 100 L1065 140"/></circle>
    </g>

    <!-- Network nodes -->
    <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
      <circle class="node" cx="885" cy="115" r="8"/>
      <circle class="node n2" cx="885" cy="165" r="8"/>
      <circle class="node n3" cx="885" cy="215" r="8"/>
      <circle class="node n2" cx="975" cy="100" r="8"/>
      <circle class="node n3" cx="975" cy="140" r="8"/>
      <circle class="node n4" cx="975" cy="180" r="8"/>
      <circle class="node n5" cx="975" cy="220" r="8"/>
      <circle class="node n4" cx="1065" cy="140" r="9" fill="#1f6feb"/>
      <circle class="node n5" cx="1065" cy="190" r="9" fill="#1f6feb"/>
    </g>

    <!-- Scanning line -->
    <g clip-path="url(#frame)">
      <g class="scanline">
        <rect x="840" y="70" width="270" height="40" fill="url(#scan)"/>
        <line x1="840" y1="110" x2="1110" y2="110" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.8"/>
      </g>
    </g>

    <!-- Caption -->
    <text x="840" y="288" class="mono">&gt; turning data into real world solutions<tspan class="cursor" fill="#58a6ff">_</tspan></text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
